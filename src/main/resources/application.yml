spring:
  application:
    name: ivelox-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/ivelox;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Supabase public schema is non-empty (extensions/default objects).
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

ivelox:
  # Comma-separated browser origins allowed for CORS
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt-secret: ${JWT_SECRET:dev-change-me-use-a-long-secret-key-32b}
  jwt-ttl-seconds: ${JWT_TTL_SECONDS:3600}
  telegram-bot-token: ${TELEGRAM_BOT_TOKEN:}
  telegram-chat-id: ${TELEGRAM_CHAT_ID:}
  otp-ttl-seconds: ${OTP_TTL_SECONDS:300}
  otp-min-interval-seconds: ${OTP_MIN_INTERVAL_SECONDS:30}
  health-enabled: ${HEALTH_ENABLED:true}
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-model: ${GEMINI_MODEL:gemini-2.0-flash}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.ivelox: INFO
